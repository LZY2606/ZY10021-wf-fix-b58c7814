name: Build

on:
    push:
        branches:
            - main
        paths: [ '**.java', '.github/workflows/build.yml', 'pom.xml' ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                java: [8, 11, 17, 21 ]
        name: Java ${{ matrix.java }}
        steps:
            -   uses: actions/checkout@v3

            -   name: Setup JDK
                uses: actions/setup-java@v3
                with:
                    distribution: temurin
                    java-version: ${{ matrix.java }}
                    cache: maven

                # Documented preparation step from VERIFYING.md: populates the local
                # Maven repository so that verify.sh can run fully offline.
            -   name: Populate Maven cache
                run: mvn -q -DskipTests package

                # Single verification entry point. No extra flags, no hidden parameters.
            -   name: Verify
                run: sh ./verify.sh
