name: Build

on:
    push:
        branches:
            - main
        paths: [ '**.java', '**.sh', '.github/workflows/build.yml', 'pom.xml', 'verify/**' ]
    pull_request:

jobs:
    verify:
        # verify.sh is the single verification entry point - no separate CI-only flags or stages.
        # The toolchain-lock stage pins these exact versions and fails the job on mismatch.
        runs-on: ubuntu-latest
        name: verify.sh (JDK 26, Maven 3.9.16)
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup JDK 26
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '26'
                    cache: maven

            -   name: Setup Maven 3.9.16
                uses: stCarolas/setup-maven@v4.5
                with:
                    maven-version: 3.9.16

            -   name: Verify (offline after the one-time dependency warm-up)
                run: sh ./verify.sh
